<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Overtiq — Race engineer</title>
  <meta name="description" content="Haas race command for car 31.">
  <link rel="stylesheet" href="style.css?v=85">
</head>
<body class="home-page">
  <header class="topbar home-topbar">
    <a class="brand" href="./" aria-label="Overtiq home"><i></i><span>OVERTIQ</span><small>HAAS F1 TEAM</small></a>
    <nav class="home-nav" aria-label="Race engineer tools"><a href="workspace.html?view=delta">SCENARIO DELTA</a></nav>
    <div class="home-system"><i></i><span id="home-gpu">CHECKING GPU</span></div>
  </header>

  <main class="home-shell">
    <section class="home-hero">
      <div class="home-kicker"><span>ROUND 08</span><span>MONACO</span><span>CAR 31</span></div>
      <div class="home-title"><span>RACE</span><strong>COMMAND</strong></div>
      <p>Esteban Ocon · Monaco Grand Prix</p>
      <div class="home-actions">
        <a class="home-primary" href="workspace.html?view=delta">OPEN SCENARIO DELTA <span>↗</span></a>
      </div>
      <div class="car-number" aria-hidden="true">31</div>
    </section>

    <footer class="home-footer"><span>OVERTIQ / HAAS F1 TEAM</span><span>LIVE RACE ENGINEERING</span></footer>
  </main>

  <script>
    fetch('/health', {cache:'no-store'}).then(r => r.ok ? r.json() : Promise.reject()).then(data => {
      const node = document.getElementById('home-gpu');
      node.textContent = data.gpu && data.gpu.available ? data.gpu.device + ' · READY' : 'GPU UNAVAILABLE';
      node.parentElement.classList.toggle('ready', Boolean(data.gpu && data.gpu.available));
    }).catch(() => { document.getElementById('home-gpu').textContent = 'GPU OFFLINE'; });
  </script>
</body>
</html>
